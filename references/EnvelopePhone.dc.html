<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@300..500&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="ink" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2400" height="2400"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.4"></feDisplacementMap></filter>
  <pattern id="ep-grid" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#FAF7F0"></rect><path d="M18 0V18M0 18H18" stroke="#111111" stroke-opacity="0.1" stroke-width="1"></path></pattern>
  <pattern id="ep-dot" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#F6F1E6"></rect><circle cx="8" cy="8" r="1.1" fill="#111111" fill-opacity="0.26"></circle></pattern>
  <pattern id="ep-kraft" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#D7BC8F"></rect><circle cx="1.5" cy="1.5" r="0.6" fill="#7A5A30" fill-opacity="0.25"></circle><circle cx="5" cy="4.5" r="0.5" fill="#FFFFFF" fill-opacity="0.3"></circle></pattern>
</defs></svg>
<div style="width:410px;height:864px;padding:10px;box-sizing:border-box;background:#0b0b0b;border-radius:58px;font-family:'Shantell Sans',cursive;font-weight:300">
  <div style="position:relative;width:390px;height:844px;border-radius:48px;background:#F6F1E6;color:#111111">
    <div ref="{{ scRef }}" style="position:absolute;inset:0;border-radius:48px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;user-select:none">
      <div style="position:relative;height:{{ innerH }}px;overflow:hidden">
        <svg width="390" height="{{ innerH }}" style="position:absolute;left:0;top:0"><rect width="390" height="{{ innerH }}" fill="url(#ep-{{ bgPat }})"></rect></svg>
        <sc-for list="{{ envs }}" as="ev" hint-placeholder-count="3">
          <div style="position:absolute;left:30px;top:0;width:330px;height:196px;transform:translateY({{ ev.y }}px);opacity:{{ ev.op }};pointer-events:{{ ev.pe }};transition:transform 420ms cubic-bezier(.2,.8,.2,1), opacity 300ms ease;cursor:pointer" onClick="{{ ev.toggle }}">

            <sc-if value="{{ isKraft }}"><svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible"><g style="filter:url(#ink)" stroke="#111111" stroke-width="1.8" stroke-linejoin="round"><path d="M2 4 L165 -54 L328 2" fill="#C9AC7D"></path><path d="M2 4 L328 2 L329 194 L3 195 Z" fill="url(#ep-kraft)"></path></g></svg></sc-if>
            <sc-if value="{{ isOutline }}"><svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible"><g style="filter:url(#ink)" fill="none" stroke="#111111" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M2 4 L165 -54 L328 2"></path><path d="M2 4 L328 2 L329 194 L3 195 Z"></path></g></svg></sc-if>
            <sc-if value="{{ isVellum }}"><svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible"><path d="M2 4 L165 -54 L328 2 Z" fill="rgba(255,255,255,.45)" stroke="rgba(17,17,17,.2)" stroke-width="1"></path><rect x="2" y="2" width="326" height="193" rx="2" fill="rgba(255,255,255,.32)" stroke="rgba(17,17,17,.16)" stroke-width="1"></rect></svg></sc-if>
            <sc-if value="{{ isLip }}"><svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible;opacity:{{ ev.bodyOp }};transition:opacity 260ms ease"><g style="filter:url(#ink)" stroke="#111111" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2 4 L328 2 L329 194 L3 195 Z" fill="#FAF7F0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{ ev.draw }}" style="transition:stroke-dashoffset 520ms cubic-bezier(.2,.8,.2,1) 80ms"></path><path d="M2 4 L165 -54 L328 2" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{ ev.draw }}" style="transition:stroke-dashoffset 420ms cubic-bezier(.2,.8,.2,1) 260ms"></path></g></svg></sc-if>

            <sc-for list="{{ ev.items }}" as="it" hint-placeholder-count="2">
              <div style="position:absolute;left:{{ it.x }}px;top:{{ it.y }}px;opacity:{{ it.op }};transition:left 420ms cubic-bezier(.2,.8,.2,1) {{ it.delay }}ms, top 420ms cubic-bezier(.2,.8,.2,1) {{ it.delay }}ms, opacity 200ms"><dc-import name="Item" type="{{ it.type }}" text="{{ it.text }}" label="{{ it.label }}" city="{{ it.city }}" date="{{ it.date }}" year="{{ it.year }}" denom="{{ it.denom }}" dur="{{ it.dur }}" src="{{ it.src }}" from="{{ it.from }}" viewer="other" attach="{{ it.attach }}" flippable="{{ it.flip }}" rot="{{ it.rot }}" zoom="{{ it.z }}" hint-size="{{ it.hint }}"></dc-import></div>
            </sc-for>

            <sc-if value="{{ isKraft }}">
              <svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(80,60,30,.18))"><g style="filter:url(#ink)" stroke="#111111" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 92 L165 148 L328 90 L329 194 L3 195 Z" fill="url(#ep-kraft)"></path><path d="M4 194 L128 132 M328 193 L204 132" fill="none" stroke-width="1.2"></path></g></svg>
              <div style="position:absolute;left:22px;top:156px;background:#161616;color:#FAF7F0;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:14px;letter-spacing:.22em;padding:5px 10px 4px 12px;transform:rotate(-1.5deg);box-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none">{{ ev.label }}</div>
              <div style="position:absolute;right:20px;top:150px;width:24px;height:28px;background:#D8422C;transform:rotate(4deg);pointer-events:none"></div>
            </sc-if>
            <sc-if value="{{ isOutline }}">
              <svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none"><g style="filter:url(#ink)" stroke="#111111" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 92 L165 148 L328 90 L329 194 L3 195 Z" fill="#F6F1E6"></path><path d="M4 194 L128 132 M328 193 L204 132" fill="none" stroke-width="1"></path></g></svg>
              <div style="position:absolute;left:20px;top:152px;padding:4px 14px 5px;background:rgba(215,188,143,.72);clip-path:polygon(0 8%, 4% 0, 8% 10%, 12% 2%, 100% 0, 97% 30%, 100% 55%, 96% 80%, 100% 100%, 6% 100%, 0 85%, 3% 50%);transform:rotate(-3deg);font-size:15px;white-space:nowrap;pointer-events:none">{{ ev.label }}</div>
              <div style="position:absolute;right:20px;top:150px;width:22px;height:26px;background:#D8422C;transform:rotate(4deg);pointer-events:none"></div>
            </sc-if>
            <sc-if value="{{ isVellum }}">
              <div style="position:absolute;left:0;top:0;width:330px;height:196px;clip-path:polygon(3px 92px, 165px 148px, 328px 90px, 329px 194px, 3px 195px);background:rgba(250,248,243,.6);backdrop-filter:blur(2px) saturate(.85);-webkit-backdrop-filter:blur(2px) saturate(.85);pointer-events:none"></div>
              <svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none"><path d="M3 92 L165 148 L328 90" fill="none" stroke="rgba(17,17,17,.28)" stroke-width="1"></path><path d="M4 194 L128 132 M328 193 L204 132" fill="none" stroke="rgba(17,17,17,.12)" stroke-width="1"></path></svg>
              <div style="position:absolute;left:24px;top:162px;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:14px;letter-spacing:.24em;color:#111111;white-space:nowrap;pointer-events:none">{{ ev.label }}</div>
              <div style="position:absolute;right:22px;top:154px;width:20px;height:24px;background:#D8422C;opacity:.85;transform:rotate(4deg);pointer-events:none"></div>
            </sc-if>
            <sc-if value="{{ isLip }}">
              <svg width="330" height="196" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none"><path d="M-6 100 L128 101 Q165 120 202 101 L336 100 L336 154 L-6 154 Z" fill="#F6F1E6"></path><g style="filter:url(#ink)" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-2 100 L128 101 Q165 120 202 101 L332 100"></path></g></svg>
              <div style="position:absolute;left:115px;top:122px;width:100px;height:26px;pointer-events:none">
                <svg width="100" height="26" style="position:absolute;inset:0;overflow:visible"><g style="filter:url(#ink)" fill="none" stroke="#111111" stroke-width="1.3"><path d="M1 1 L99 2 L98 25 L2 24 Z"></path><path d="M6 6 L94 6 L94 20 L6 20 Z" stroke-width="0.9"></path></g></svg>
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:12px;letter-spacing:.2em">{{ ev.label }}</div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{ envOpen }}">
      <div style="position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;z-index:40"><div style="padding:12px 22px;background:#FFFFFF;border-radius:360px;font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:15px;color:#181616;box-shadow:0 7px 7.5px rgba(143,143,143,.1), 0 27px 13.5px rgba(143,143,143,.09);cursor:pointer" onClick="{{ envClose }}">put them back</div></div>
    </sc-if>
    <div style="position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#111111;z-index:45;pointer-events:none"></div>
    <div style="position:absolute;top:17px;left:38px;z-index:50;font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:15px">9:41</div>
    <div style="position:absolute;top:52px;left:37.5px;z-index:50"><dc-import name="ScrapbookHeader" hint-size="315px,61px"></dc-import></div>
    <sc-if value="{{ hasFab }}"><dc-import name="AddFab" placement="{{ fabPlacement }}" hidden="{{ envOpen }}" hint-size="390px,844px" style="position:absolute;left:0;top:0;width:390px;height:844px;z-index:60;pointer-events:none"></dc-import></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:410,&quot;height&quot;:864},&quot;look&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;kraft&quot;,&quot;outline&quot;,&quot;vellum&quot;,&quot;lip&quot;],&quot;default&quot;:&quot;outline&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:-28,&quot;max&quot;:24,&quot;step&quot;:1,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;fab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;bc&quot;,&quot;br&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { env: -1 };
  scRef = React.createRef();
  IT = {
    beer: { type: 'stamp', text: 'cranberry beer @ vault', label: 'vault', city: 'bengaluru', date: '12 oct', year: '2026', denom: '2', src: 'assets/photo-beer.png', from: 'priya' },
    quiet: { type: 'tag', text: 'the quiet hour', src: 'assets/thumb-quiet.png', date: '4 oct', year: '2026', from: 'maya' },
    leh: { type: 'stamp', text: 'juley', label: 'leh', city: 'leh', date: '28 sep', year: '2026', denom: '5', src: 'assets/photo-leh.png', from: 'jun' },
    film: { type: 'note', text: 'you laughed at the exact same part of the film i did, a full second before everyone else.', date: '19 sep', year: '2026', from: 'priya' },
    v1: { type: 'voice', dur: '0:42', date: '3 sep', year: '2026', from: 'theo' },
    beach: { type: 'stamp', text: 'low tide, all four of us', label: 'marina', city: 'chennai', date: '2 aug', year: '2026', denom: '3', src: 'assets/photo-beach.png', from: 'maya' },
    dog: { type: 'note', text: "saw a dog in a raincoat and it was so obviously your dog. you don't have a dog.", date: '11 aug', year: '2026', from: 'jun' },
    buses: { type: 'tag', text: 'songs for buses', date: '20 jul', year: '2026', from: 'theo' },
    soup: { type: 'stamp', text: 'tuesday soup', label: 'kitchen', city: 'pune', date: '8 jul', year: '2026', denom: '1', from: 'priya' },
    v2: { type: 'voice', dur: '1:07', date: '21 jun', year: '2026', from: 'maya' },
    anyway: { type: 'note', text: "the way you say 'anyway' like a door closing", date: '2 jun', year: '2026', from: 'jun' },
    snow: { type: 'stamp', text: 'first snow', label: 'snow', city: 'manali', date: '14 dec', year: '2025', denom: '5', from: 'theo' }
  };
  SZ = { stamp: [150, 196], note: [200, 170], voice: [230, 146], tag: [124, 200] };
  DEF = { kraft: -28, outline: 20, vellum: 20, lip: 18 };
  look() { return this.props.look ?? 'outline'; }
  renderVals() {
    const S = this.state, look = this.look(), gap = this.props.gap ?? this.DEF[look], fab = this.props.fab || null;
    const EXT = look === 'lip' ? 190 : 250, top0 = look === 'kraft' ? 150 : 168;
    const CY = [0, 1, 2].map(i => top0 + i * (EXT + gap));
    const contentH = Math.max(844, CY[2] + 196 + (fab ? 110 : 40));
    const any = S.env >= 0, OY = 616;
    const FAN = [{ x: 18, y: 138, rot: -6 }, { x: 214, y: 128, rot: 5 }, { x: 116, y: 268, rot: -2 }, { x: 8, y: 404, rot: 4 }, { x: 222, y: 392, rot: -5 }, { x: 120, y: 452, rot: 7 }];
    const PEEK = [{ x: 14, rot: -7 }, { x: 102, rot: 3 }, { x: 188, rot: 8 }];
    const SLOT = [{ x: 22, rot: -2 }, { x: 96, rot: 1.5 }, { x: 166, rot: -1 }, { x: 228, rot: 2 }];
    const SE = [['AUTUMN ’26', ['beer', 'quiet', 'leh', 'film', 'v1']], ['SUMMER ’26', ['beach', 'dog', 'buses', 'soup', 'v2', 'anyway']], ['WINTER ’25', ['snow']]];
    const lower = look === 'outline';
    const envs = SE.map(([label, ids], i) => {
      const open = S.env === i;
      return {
        label: lower ? label.toLowerCase() : label,
        y: !any ? CY[i] : open ? OY : 920, op: !any || open ? 1 : 0, pe: !any || open ? 'auto' : 'none',
        bodyOp: open ? 1 : 0, draw: open ? 0 : 1,
        toggle: () => { if (!open) { const el = this.scRef.current; if (el) el.scrollTo({ top: 0, behavior: 'smooth' }); } this.setState({ env: open ? -1 : i }); },
        items: ids.map((id, k) => {
          const b = this.IT[id], s = this.SZ[b.type], z = .7, w = s[0] * z, h = s[1] * z;
          let x, y, rot, op = 1;
          if (open) { const f = FAN[k % 6]; x = f.x - 30; y = f.y - OY; rot = f.rot; }
          else if (look === 'lip') { if (k < 4) { x = SLOT[k].x; y = Math.round(132 - h); rot = SLOT[k].rot; } else { x = 100; y = 120; rot = 0; op = 0; } }
          else if (k < 3) { x = PEEK[k].x; y = Math.round(124 - h); rot = PEEK[k].rot; }
          else if (look === 'vellum') { x = 40 + (k - 3) * 130; y = 100; rot = (k % 2 ? 3 : -3); }
          else { x = 100; y = 100; rot = 0; op = 0; }
          return { ...b, z, x, y, rot, op, flip: open, delay: k * 30, attach: k === 0 && look !== 'lip' ? 'tape' : 'none', hint: Math.round(w) + 'px,' + Math.round(h) + 'px' };
        })
      };
    });
    return {
      scRef: this.scRef, innerH: any ? 844 : contentH, envs, envOpen: any, envClose: () => this.setState({ env: -1 }),
      isKraft: look === 'kraft', isOutline: look === 'outline', isVellum: look === 'vellum', isLip: look === 'lip',
      bgPat: look === 'kraft' ? 'grid' : 'dot',
      hasFab: !!fab, fabPlacement: fab === 'br' ? 'br' : 'bc'
    };
  }
}
</script>
</body>
</html>

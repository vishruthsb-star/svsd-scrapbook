<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@300..500&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="ink" filterUnits="userSpaceOnUse" x="-300" y="-300" width="2400" height="2400"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.4"></feDisplacementMap></filter>
  <pattern id="cp-grid" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#F8F6F0"></rect><path d="M20 0V20M0 20H20" stroke="#111111" stroke-opacity="0.08" stroke-width="1"></path></pattern>
</defs></svg>
<div style="width:410px;height:864px;padding:10px;box-sizing:border-box;background:#0b0b0b;border-radius:58px;font-family:'Shantell Sans',cursive;font-weight:300">
  <div style="position:relative;width:390px;height:844px;border-radius:48px;background:#F8F6F0;color:#111111">
    <div style="position:absolute;inset:0;border-radius:48px;overflow:hidden">
      <svg width="390" height="844" style="position:absolute;inset:0"><rect width="390" height="844" fill="url(#cp-grid)"></rect></svg>
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <div style="position:absolute;left:{{ it.x }}px;top:{{ it.y }}px"><dc-import name="Item" type="{{ it.type }}" text="{{ it.text }}" label="{{ it.label }}" city="{{ it.city }}" date="{{ it.date }}" year="{{ it.year }}" denom="{{ it.denom }}" src="{{ it.src }}" from="{{ it.from }}" viewer="other" field="#F8F6F0" rot="{{ it.rot }}" zoom="{{ it.z }}" hint-size="{{ it.hint }}"></dc-import></div>
      </sc-for>
      <div style="position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#111111"></div>
    </div>
    <div style="position:absolute;top:17px;left:38px;z-index:50;font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:15px">9:41</div>
    <div style="position:absolute;top:52px;left:37.5px;z-index:50"><dc-import name="ScrapbookHeader" hint-size="315px,61px"></dc-import></div>
    <dc-import name="AddFab" placement="{{ placement }}" start-open="{{ startOpen }}" hint-size="390px,844px" style="position:absolute;left:0;top:0;width:390px;height:844px;z-index:60;pointer-events:none"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:410,&quot;height&quot;:864},&quot;placement&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;br&quot;,&quot;bc&quot;,&quot;tr&quot;,&quot;slip&quot;,&quot;corner&quot;,&quot;dock&quot;],&quot;default&quot;:&quot;br&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sz = { stamp: [150, 196], tag: [124, 200] };
    const mk = (o) => { const s = sz[o.type]; return { ...o, hint: Math.round(s[0] * o.z) + 'px,' + Math.round(s[1] * o.z) + 'px' }; };
    return {
      placement: this.props.placement ?? 'br',
      startOpen: !!this.props.startOpen,
      items: [
        mk({ type: 'stamp', text: 'cranberry beer @ vault', label: 'vault', city: 'bengaluru', date: '12 oct', year: '2026', denom: '2', src: 'assets/photo-beer.png', from: 'priya', x: 16, y: 178, rot: -2, z: 1.2 }),
        mk({ type: 'tag', text: 'the quiet hour', src: 'assets/thumb-quiet.png', from: 'maya', x: 222, y: 318, rot: 6, z: 1.22 }),
        mk({ type: 'stamp', text: 'juley', label: 'leh', city: 'leh', date: '28 sep', year: '2026', denom: '5', src: 'assets/photo-leh.png', from: 'jun', x: 2, y: 468, rot: 2, z: 1.2 }),
        mk({ type: 'stamp', text: 'low tide, all four of us', label: 'marina', city: 'chennai', date: '2 aug', year: '2026', denom: '3', src: 'assets/photo-beach.png', from: 'maya', x: 172, y: 652, rot: -1, z: 1.2 })
      ]
    };
  }
}
</script>
</body>
</html>
